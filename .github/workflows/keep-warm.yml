# Ping the site every few minutes so a visitor rarely meets a cold start: the first
# request to a sleeping Vercel function loads the deck and takes seconds. /api/health
# never touches the database, so this does not keep Neon awake. GitHub runs scheduled
# workflows on a best-effort basis, so cold starts become rarer, not impossible.
name: keep-warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 30 https://uclnights11.vercel.app/api/health
