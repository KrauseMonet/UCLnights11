<body>
<main class="sheet">
  <section class="friends-hero"><div class="kicker">Admin</div><h1 class="arch-h" id="adminh">Checking…</h1></section>
  <div id="admin" hidden>
    <div class="home-stats admin-stats" id="astats"></div>
    <section class="panel"><div class="panel-h"><span class="label">Sign-ups, last 14 days</span></div>
      <div class="bars" id="signups"></div></section>
    <div class="friends-grid">
      <section class="panel">
        <div class="panel-h"><span class="label">Accounts</span><span class="label">newest first</span></div>
        <form class="join" id="asearch" autocomplete="off">
          <input id="aq" placeholder="username or email" aria-label="Search accounts" spellcheck="false">
          <button class="btn ghost" type="submit">Search</button></form>
        <div id="alist"></div>
      </section>
      <section class="panel">
        <div class="panel-h"><span class="label">Rooms</span><span class="label">recently active</span></div>
        <div id="rlist"></div>
      </section>
    </div>
    <section class="panel admin-fail"><div class="panel-h"><span class="label">What browsers saw go wrong</span><span class="label">last 7 days</span></div>
      <div id="flist"></div></section>
  </div>
</main>
