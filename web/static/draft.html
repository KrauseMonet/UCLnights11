<body>
<main class="sheet">
  <div class="draft-top">
    <h1 id="formname">Draft</h1>
    <div class="progress"><span class="label"><span id="progtext">Pick <b id="pickno">1</b> of <span id="picktotal">11</span></span><span id="memtag" hidden> · <span class="memtag">Memory</span></span></span>

  </div>
  <div class="draft-grid">
    <section class="panel deal" id="deal" aria-live="polite"></section>
    <aside class="panel">
      <div class="panel-h"><span class="label">Your XI</span><span class="label" id="xisub"></span></div>
      <div class="pitch" id="pitch"></div>
      <div class="bench-row" id="bench" hidden></div>
      <div class="xi-foot" id="xifoot"></div>
    </aside>
  </div>
</main>
